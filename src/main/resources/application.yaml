spring:
  application:
    name: ai-triage-service
  ai:
    model:
      chat: ${SPRING_AI_CHAT_MODEL:none}
      embedding: ${SPRING_AI_EMBEDDING_MODEL:none}
      image: ${SPRING_AI_IMAGE_MODEL:none}
    openai-sdk:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/triage}
    username: ${DB_USERNAME:triage}
    password: ${DB_PASSWORD:triage}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 35000
        linger.ms: 20
        request.timeout.ms: 10000
        retry.backoff.ms: 1000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ai-triage-service}
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true

application:
  integration-events:
    contracts:
      ai-analysis-completed:
        event-type: ${EVENT_AI_ANALYSIS_COMPLETED:AiAnalysisCompleted}
        version: ${EVENT_AI_ANALYSIS_COMPLETED_VERSION:1}
      ai-analysis-failed:
        event-type: ${EVENT_AI_ANALYSIS_FAILED:AiAnalysisFailed}
        version: ${EVENT_AI_ANALYSIS_FAILED_VERSION:1}
      tag-created:
        event-type: ${EVENT_TAG_CREATED:TagCreated}
        version: ${EVENT_TAG_CREATED_VERSION:1}
      tag-deleted:
        event-type: ${EVENT_TAG_DELETED:TagDeleted}
        version: ${EVENT_TAG_DELETED_VERSION:1}
      tag-ai-setting-updated:
        event-type: ${EVENT_TAG_AI_SETTING_UPDATED:TagAISettingUpdated}
        version: ${EVENT_TAG_AI_SETTING_UPDATED_VERSION:1}
      knowledge-article-approved:
        event-type: ${EVENT_KNOWLEDGE_ARTICLE_APPROVED:KnowledgeArticleApproved}
        version: ${EVENT_KNOWLEDGE_ARTICLE_APPROVED_VERSION:1}
      ticket-created:
        event-type: ${EVENT_TICKET_CREATED:TicketCreated}
        version: ${EVENT_TICKET_CREATED_VERSION:1}
      ticket-message-added:
        event-type: ${EVENT_TICKET_MESSAGE_ADDED:TicketMessageAdded}
        version: ${EVENT_TICKET_MESSAGE_ADDED_VERSION:1}
      ticket-tag-updated:
        event-type: ${EVENT_TICKET_TAG_UPDATED:TicketTagUpdated}
        version: ${EVENT_TICKET_TAG_UPDATED_VERSION:1}
  inbox:
    ignored-events:
      ai-triage.knowledge-management:
        - ${EVENT_KNOWLEDGE_ARTICLE_DRAFT_SAVED:KnowledgeArticleDraftSaved}
        - ${EVENT_KNOWLEDGE_ARTICLE_DRAFT_SAVE_FAILED:KnowledgeArticleDraftSaveFailed}
        - ${EVENT_KNOWLEDGE_ARTICLE_REJECTED:KnowledgeArticleRejected}
  kafka:
    consumer:
      ticket-management-events: ${KAFKA_TOPIC_TICKET_MANAGEMENT_EVENTS:ticket-management-events}
      knowledge-base-events: ${KAFKA_TOPIC_KNOWLEDGE_BASE_EVENTS:knowledge-base-events}
      organization-access-events: ${KAFKA_TOPIC_ORGANIZATION_ACCESS_EVENTS:organization-access-events}
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
    producer:
      ai-triage-events: ${KAFKA_TOPIC_AI_TRIAGE_EVENTS:ai-triage-events}
    dlt:
      name: ${KAFKA_TOPIC_AI_TRIAGE_DLT:ai-triage-events-dlt}
      backoff-ms: ${KAFKA_DLT_BACKOFF_MS:1000}
      max-attempts: ${KAFKA_DLT_MAX_ATTEMPTS:5}
    topics:
      defaults:
        partitions: ${KAFKA_TOPIC_PARTITIONS:3}
        replicas: ${KAFKA_TOPIC_REPLICAS:1}
        min-in-sync-replicas: ${KAFKA_TOPIC_MIN_ISR:1}
      owned:
        ai-triage-events: ${KAFKA_TOPIC_AI_TRIAGE_EVENTS:ai-triage-events}
        ai-triage-events-dlt: ${KAFKA_TOPIC_AI_TRIAGE_DLT:ai-triage-events-dlt}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:2000}
    lock-at-most-for: ${OUTBOX_LOCK_AT_MOST_FOR:PT30S}
    lock-at-least-for: ${OUTBOX_LOCK_AT_LEAST_FOR:PT0S}
    batch-send-timeout: ${OUTBOX_BATCH_SEND_TIMEOUT:PT40S}
    retry-backoff: ${OUTBOX_RETRY_BACKOFF:PT1S}
    max-retry-backoff: ${OUTBOX_MAX_RETRY_BACKOFF:PT5M}
    stuck-timeout: ${OUTBOX_STUCK_TIMEOUT:PT2M}
    routing:
      triage:
        # Keyed by the stable @IntegrationEvent contract key, not the env-overridable wire eventType.
        event-topics:
          ai-analysis-completed: ${KAFKA_TOPIC_AI_TRIAGE_EVENTS:ai-triage-events}
          ai-analysis-failed: ${KAFKA_TOPIC_AI_TRIAGE_EVENTS:ai-triage-events}
  rag:
    embedding:
      model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
    chunking:
      max-chars: ${RAG_CHUNK_MAX_CHARS:1800}
      overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:200}
    indexing:
      enabled: ${RAG_INDEXING_ENABLED:false}
      batch-size: ${RAG_INDEXING_BATCH_SIZE:25}
      max-attempts: ${RAG_INDEXING_MAX_ATTEMPTS:5}
      poll-delay-ms: ${RAG_INDEXING_POLL_DELAY_MS:5000}
      lock-at-most-for: ${RAG_INDEXING_LOCK_AT_MOST_FOR:PT2M}
      lock-at-least-for: ${RAG_INDEXING_LOCK_AT_LEAST_FOR:PT0S}
      stuck-timeout: ${RAG_INDEXING_STUCK_TIMEOUT:PT10M}
  ai:
    tag-suggestion:
      provider: ${TAG_SUGGESTION_PROVIDER:stub}
      model: ${TAG_SUGGESTION_MODEL:gpt-5.4-mini}
      max-output-tokens: ${TAG_SUGGESTION_MAX_OUTPUT_TOKENS:1000}
      safe-logging-enabled: ${TAG_SUGGESTION_SAFE_LOGGING_ENABLED:true}
