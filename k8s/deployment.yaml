apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-ai-triage
  labels:
    app: service-ai-triage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-ai-triage
  template:
    metadata:
      labels:
        app: service-ai-triage
    spec:
      containers:
      - name: service-ai-triage
        #Replace with actual container registry URL
        image: your-registry.com/issueresolutionorg/service-ai-triage:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: service-ai-triage-config
