apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-triage
  labels:
    app: ai-triage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-triage
  template:
    metadata:
      labels:
        app: ai-triage
    spec:
      initContainers:
      - name: wait-for-keycloak
        image: busybox:1.36
        command: ['sh', '-c', 'until wget -q -O - http://keycloak.default.svc.cluster.local:9000/health/ready; do echo "Waiting for Keycloak..."; sleep 5; done;']
      containers:
      - name: ai-triage
        image: your-registry.com/supporthub/ai-triage:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx1024m"
        envFrom:
        - configMapRef:
            name: ai-triage-config
        - secretRef:
            name: ai-triage-secret
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 300
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 60